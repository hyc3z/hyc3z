    <g fill="#FFC2D8" opacity=".7">
      <path d="M 700 120 C 706 112 716 113 717 121 C 716 129 706 132 700 127 C 696 124 697 122 700 120 Z"/>
      <path d="M 1126 170 C 1132 162 1142 163 1143 171 C 1142 179 1132 182 1126 177 C 1122 174 1123 172 1126 170 Z"/>
      <path d="M 1118 470 C 1124 462 1134 463 1135 471 C 1134 479 1124 482 1118 477 C 1114 474 1115 472 1118 470 Z"/>
    </g>

