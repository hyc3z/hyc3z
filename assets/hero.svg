        <g>
          <animateTransform attributeName="transform" type="scale" values=".7;1.05;.7" dur="3.4s" repeatCount="indefinite"/>
          <use href="#sparkle" transform="scale(.85)"/>
        </g>
      </g>
    </g>
    <g fill="#7FDCC6" opacity=".85">
      <g transform="translate(1084 296)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1;.65;1" dur="4.2s" repeatCount="indefinite"/>
          <use href="#sparkle" transform="scale(.6)"/>
        </g>
      </g>
    </g>
    <g fill="#FF9DBF" opacity=".8">
      <g transform="translate(778 352)">
        <g>
          <animateTransform attributeName="transform" type="scale" values=".6;1;.6" dur="3s" repeatCount="indefinite"/>
          <use href="#sparkle" transform="scale(.5)"/>
        </g>
      </g>
    </g>
    <g fill="#FF9DBF" opacity=".75">
      <g transform="translate(762 232)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5.2s" repeatCount="indefinite"/>
          <use href="#heart" transform="scale(.9)"/>
        </g>
