    <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',sans-serif">
      <g transform="translate(76 54)">
        <rect width="266" height="36" rx="18" fill="#FFFFFF" opacity=".8"/>
        <rect x=".5" y=".5" width="265" height="35" rx="17.5" fill="none" stroke="#FFB9D2"/>
        <g transform="translate(21 18) scale(.62)" fill="#F27AA6">
          <use href="#paw"/>
        </g>
        <text x="42" y="23" font-size="12" letter-spacing="2.1" fill="#E2608F" font-weight="600">NEKO DEVELOPER · 猫娘形态</text>
