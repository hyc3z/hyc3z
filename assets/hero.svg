<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">hyc3z — 猫娘开发者</title>
  <desc id="heroDesc">奶油粉色的二次元横幅：左边写着 hyc3z 与「把好奇心写成代码，把脑洞养成现实喵～」，右边是粉发猫耳、奶油色卫衣配薄荷领口的猫娘，正眨眼卖萌，尾巴轻轻摇晃。</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F3"/>
      <stop offset=".52" stop-color="#FFF1F8"/>
      <stop offset="1" stop-color="#F5F0FF"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx=".5" cy=".45" r=".58">
      <stop offset="0" stop-color="#FFD2E4" stop-opacity=".9"/>
      <stop offset=".65" stop-color="#FFE3EE" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFE3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC7DB"/>
      <stop offset=".55" stop-color="#FFA9C8"/>
      <stop offset="1" stop-color="#F58DB5"/>
    </linearGradient>
    <linearGradient id="hairBackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F99FC0"/>
      <stop offset="1" stop-color="#E87FA7"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B46C8"/>
      <stop offset=".55" stop-color="#C85BBC"/>
      <stop offset="1" stop-color="#FFA6C9"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#FFF0E8"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#F2AFC8" opacity=".55"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="520" rx="26"/>
    </clipPath>
    <g id="eye">
      <ellipse rx="24.5" ry="29.5" fill="#FFFDFB"/>
      <ellipse cy="-2" rx="20.5" ry="28" fill="url(#irisGrad)"/>
      <ellipse cy="3" rx="8" ry="12" fill="#3A2342"/>
      <circle cx="-8" cy="-13" r="7" fill="#FFFFFF"/>
      <circle cx="8" cy="11" r="3.4" fill="#FFFFFF" opacity=".9"/>
      <ellipse cy="22" rx="13" ry="5" fill="#FFC7DE" opacity=".5"/>
      <path d="M -24 -20 C -17 -29 17 -29 24 -20" fill="none" stroke="#5A3F5E" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M -20 21 C -10 27 10 27 20 21" fill="none" stroke="#E3A2B4" stroke-width="2" opacity=".8"/>
    </g>
    <g id="earL">
      <path d="M 850 158 C 820 124 802 82 808 40 C 842 52 880 94 902 134 C 884 146 866 156 850 158 Z" fill="url(#hairGrad)" stroke="#F080A9" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 851 144 C 828 114 814 82 818 58 C 842 72 868 104 884 130 Z" fill="#FFC9DC"/>
      <path d="M 828 104 C 834 118 844 132 856 142" fill="none" stroke="#FFB3CC" stroke-width="2.5" opacity=".8" stroke-linecap="round"/>
    </g>
    <g id="paw">
      <ellipse cx="0" cy="3" rx="9" ry="7.5"/>
      <circle cx="-10" cy="-6" r="3.6"/>
      <circle cx="-3.4" cy="-9.5" r="3.6"/>
      <circle cx="3.4" cy="-9.5" r="3.6"/>
      <circle cx="10" cy="-6" r="3.6"/>
    </g>
    <g id="heart">
      <path d="M 0 7 C -13 -2 -9 -13 0 -7 C 9 -13 13 -2 0 7 Z"/>
    </g>
    <g id="sparkle">
      <path d="M 0 -12 C 2 -4 4 -2 12 0 C 4 2 2 4 0 12 C -2 4 -4 2 -12 0 C -4 -2 -2 -4 0 -12 Z"/>
    </g>
  </defs>

