    <!-- speech bubble -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.8s" repeatCount="indefinite"/>
      <path d="M 1050 52 h 76 a 18 18 0 0 1 18 18 v 24 a 18 18 0 0 1 -18 18 h -40 l -16 16 l 0 -16 h -20 a 18 18 0 0 1 -18 -18 v -24 a 18 18 0 0 1 18 -18 Z" fill="#FFFFFF" opacity=".94" stroke="#FFC0D7" stroke-width="2"/>
      <text x="1088" y="91" text-anchor="middle" font-family="'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20" font-weight="700" fill="#E2608F">にゃ〜</text>
