      <text x="78" y="246" font-family="'Arial Rounded MT Bold','Varela Round','Nunito','Quicksand','PingFang SC','Microsoft YaHei',sans-serif" font-size="128" font-weight="900" letter-spacing="-3" fill="#FFB6CE" opacity=".75">hyc3z</text>
      <text x="72" y="240" font-family="'Arial Rounded MT Bold','Varela Round','Nunito','Quicksand','PingFang SC','Microsoft YaHei',sans-serif" font-size="128" font-weight="900" letter-spacing="-3" fill="#4A3450">hyc3z</text>
      <use href="#sparkle" transform="translate(432 176) scale(1.15)" fill="#FFD06B"/>

      <text x="72" y="312" font-size="26" font-weight="700" letter-spacing=".3" fill="#4A3450">把好奇心写成代码，<tspan fill="#E85C94">把脑洞养成现实喵～</tspan></text>
      <text x="74" y="344" font-size="12" letter-spacing="2.3" fill="#A98BA3">CURIOSITY → CODE · DAYDREAM → REALITY</text>

      <g transform="translate(72 372)">
        <rect width="404" height="54" rx="16" fill="#4A3450"/>
        <circle cx="22" cy="27" r="4" fill="#FF8FB8"/>
        <circle cx="36" cy="27" r="4" fill="#FFD06B"/>
        <circle cx="50" cy="27" r="4" fill="#7FDCC6"/>
        <text x="70" y="32" font-family="'Cascadia Code','SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="15" fill="#B8F5E4">$ nya build --idea "world"<tspan fill="#B8F5E4">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.5;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
        <use href="#heart" transform="translate(374 27) scale(.9)" fill="#FF8FB8"/>
      </g>

      <text x="74" y="478" font-size="12" letter-spacing="1.6" fill="#A98BA3">AI &amp; AGENTS · OPEN SOURCE · SIDE EXPERIMENTS</text>
    </g>

