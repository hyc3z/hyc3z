      <circle cx="905" cy="332" r="10" fill="#FFD166" stroke="#E8A93F" stroke-width="2"/>
      <path d="M 899 335 h 12" stroke="#E8A93F" stroke-width="2" stroke-linecap="round"/>
      <circle cx="901" cy="328" r="2.6" fill="#FFF6CF"/>

