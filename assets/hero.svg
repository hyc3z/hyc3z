    <circle cx="1080" cy="30" r="180" fill="#FFE2ED" opacity=".75"/>
    <circle cx="590" cy="560" r="210" fill="#E9F8F2" opacity=".85"/>
    <circle cx="120" cy="20" r="130" fill="#F0EAFF" opacity=".65"/>
    <rect width="1200" height="520" fill="url(#dots)" opacity=".42"/>

    <!-- soft halo behind the catgirl -->
    <path d="M 706 268 C 696 168 762 86 872 76 C 986 66 1078 126 1090 226 C 1102 326 1044 414 942 440 C 836 466 738 410 716 324 C 708 296 706 282 706 268 Z" fill="url(#haloGrad)"/>
    <circle cx="900" cy="262" r="224" fill="none" stroke="#FFC3DA" stroke-width="1.6" stroke-dasharray="2 12" opacity=".85">
      <animateTransform attributeName="transform" type="rotate" from="0 900 262" to="360 900 262" dur="70s" repeatCount="indefinite"/>
    </circle>

    <!-- floating decorations -->
    <g fill="#FFD06B" opacity=".9">
