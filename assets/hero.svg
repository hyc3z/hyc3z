      <circle cx="893" cy="446" r="6.5" fill="#FFE9DD"/>
      <circle cx="905" cy="442" r="7" fill="#FFE9DD"/>
      <circle cx="917" cy="446" r="6.5" fill="#FFE9DD"/>
