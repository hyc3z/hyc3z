      <path d="M 927 186 Q 947 181 967 187" fill="none" stroke="#D98CAB" stroke-width="3.4" stroke-linecap="round"/>

      <!-- ahoge -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3 900 96;3 900 96;-3 900 96" dur="4s" repeatCount="indefinite"/>
        <path d="M 896 94 C 876 70 882 40 912 30 C 930 24 950 32 952 46" fill="none" stroke="url(#hairGrad)" stroke-width="10" stroke-linecap="round"/>
