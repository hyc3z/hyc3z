      <g fill="none" stroke="#F07FA8" stroke-width="3" stroke-linecap="round" opacity=".4">
        <path d="M 905 90 C 886 108 868 138 856 170"/>
        <path d="M 905 90 C 924 108 942 138 954 170"/>
        <path d="M 862 98 C 844 118 830 143 822 166"/>
        <path d="M 948 98 C 966 118 980 143 988 166"/>
