      <g transform="translate(945 226)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 .06;1 1" keyTimes="0;.9;.945;1" dur="5.5s" begin=".04s" repeatCount="indefinite"/>
          <use href="#eye"/>
        </g>
      </g>

